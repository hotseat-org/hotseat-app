# Hotseat for one company, with its own Postgres. See SELF_HOSTING.md.
#   cp .env.example .env   (and fill it in)
#   docker compose up -d
services:
  hotseat:
    build:
      context: ..
      # Served under a path instead of the root? e.g. BASE_PATH=/hotseat/ in .env.
      args:
        BASE_PATH: ${BASE_PATH:-/}
    image: hotseat
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://hotseat:${POSTGRES_PASSWORD}@postgres:5432/hotseat
      # Inside the container it's always 3000; PORT (.env) is this machine's.
      PORT: 3000
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - images:/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: hotseat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: hotseat
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotseat -d hotseat"]
      interval: 5s
      retries: 10

volumes:
  database:
  images:
