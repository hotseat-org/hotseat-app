# Hotseat for one company, with its own Postgres (the "database" profile, on
# in the settings) — or with your own: set DATABASE_URL, turn the profile off.
# Next to it: .env, its settings (from .env.example, filled in). Then:
#   docker compose up -d
# Guide: https://github.com/hotseat-org/hotseat-app/tree/main/docs/self-hosting
# Built from the source instead (or served under a path): compose.build.yml,
# https://github.com/hotseat-org/hotseat-app/tree/main/self-hosting
services:
  hotseat:
    # The release pinned in .env (HOTSEAT_VERSION).
    image: ghcr.io/hotseat-org/hotseat:${HOTSEAT_VERSION:-alpha}
    restart: unless-stopped
    env_file: .env
    environment:
      # Your own database's, if DATABASE_URL is set; else the one alongside.
      DATABASE_URL: ${DATABASE_URL:-postgres://hotseat:${POSTGRES_PASSWORD:-}@postgres:5432/hotseat}
      # Inside the container it's always 3000; PORT (.env) is this machine's.
      PORT: 3000
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - images:/data
    depends_on:
      postgres:
        condition: service_healthy
        # Not there when you use your own database (the profile is off).
        required: false

  # The database alongside: only with the "database" profile (COMPOSE_PROFILES in .env).
  postgres:
    image: postgres:17
    profiles: [database]
    restart: unless-stopped
    environment:
      POSTGRES_USER: hotseat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: hotseat
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotseat -d hotseat"]
      interval: 5s
      retries: 10

volumes:
  database:
  images:
