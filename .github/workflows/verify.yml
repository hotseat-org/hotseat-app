# The checks every change and every release passes: types, lint, tests,
# translations. (Called by check.yml and release.yml.)
name: Verify

on:
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - name: Install (also generates the Prisma clients)
        run: bun install --frozen-lockfile
      - name: Types
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Tests
        run: bun run test
      - name: Translations
        run: bun run i18n:check
