<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Hot Seat "Dusk": three contour lines across a slope, like the app's
       terrain — warm at dusk on a night-blue tile. Each rises gently mid-way
       and settles to the right; the lines fan out down the slope. -->
  <clipPath id="tile"><rect width="64" height="64" rx="14"/></clipPath>
  <rect width="64" height="64" rx="14" fill="#2c3866"/>
  <g clip-path="url(#tile)" fill="none" stroke-linecap="round">
    <path d="M-4 28.0C14 18.0 30 16.0 46 22.0S62 28.0 68 26.0" stroke="#f6c560" stroke-width="5.5"/>
    <path d="M-4 40.0C14 29.1 30 26.8 46 33.7S62 40.6 68 38.3" stroke="#ef8a5b" stroke-width="5.5"/>
    <path d="M-4 52.0C14 40.2 30 37.6 46 45.4S62 53.2 68 50.6" stroke="#d1607e" stroke-width="5.5"/>
  </g>
</svg>
